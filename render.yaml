# Render Blueprint Configuration (Infrastructure as Code)
# 使用現有 PostgreSQL 資料庫部署 Web Service

services:
  - type: web
    name: gaga-shopping-service
    runtime: node
    plan: free # Render 免費方案 (512MB RAM)
    region: singapore # 或 oregon / frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # 沿用現有資料庫：部署時貼入現有 PostgreSQL 的 Internal Database URL
      - key: JWT_SECRET
        generateValue: true
      # 若日後要啟用 Cloudinary 永久圖床，可直接在 Render Web Service 的 Environment 頁籤新增：
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
